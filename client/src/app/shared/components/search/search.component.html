<div class="search-container flex mgt2">
  <!-- basic Form -->

  <form
    [formGroup]="basicForm"
    (ngSubmit)="basicSearch()"
    class="basic-form flex flex-center mg1"
    >
    <h3 class="pd1">Search Recipes</h3>
    <div class="basic-search-box flex mg1">
      <input
        type="text"
        formControlName="searchValue"
        placeholder="Search..."
        />
      <button type="submit" class="hover-effect" aria-label="search recipes">
        <fa-icon [icon]="icons.faSearch" class="search"></fa-icon>
      </button>
    </div>
    <div class="select-box mgb1">
      <select formControlName="basicOption" class="basic-select">
        <option value="">Select option</option>
        @for (option of basicOptions; track option) {
          <option
            [value]="option.toLowerCase()"
            >
            {{ option }}
          </option>
        }
      </select>
    </div>
  </form>

  <!-- optional form -->
  <form
    class="optional-form mg1"
    [formGroup]="categoriesForm"
    (ngSubmit)="categoriesSearch()"
    >
    <h3 class="pd1">Search By Categories</h3>
    <div class="dish-types">
      <label for="dishType">Dish type</label>
      <div class="select-box mgb1">
        <select formControlName="dishType" class="categories">
          <option value="">Any category</option>
          @for (option of dishTypeOptions; track option) {
            <option
              [value]="option.toLowerCase()"
              >
              {{ option }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="difficulty">
      <label for="">Difficulty</label>
      <div class="select-box mgb1">
        <select formControlName="difficulty" class="categories">
          <option value="">Any category</option>
          @for (option of difficultyOptions; track option) {
            <option
              [value]="option.toLowerCase()"
              >
              {{ option }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="check-boxes flex">
      <label for="vegetarianCheck" class="block"
        >Vegetarian
        <input
          type="checkbox"
          id="vegetarianCheck"
          formControlName="vegetarian"
          />
        <span tabindex="0"></span>
      </label>
      <label for="glutenCheck" class="block"
        >Gluten Free
        <input
          type="checkbox"
          id="glutenCheck"
          formControlName="glutenFree"
          />
        <span tabindex="0"></span>
      </label>
    </div>
    <button type="submit" class="btn-action mg1 hov-effect">Search</button>
  </form>
</div>
